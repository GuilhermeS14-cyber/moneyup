services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fintcc
      POSTGRES_USER: fintcc_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - fintcc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintcc_app -d fintcc"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4173
      DATABASE_URL: postgresql://fintcc_app:${POSTGRES_PASSWORD}@db:5432/fintcc?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no .env}
      CSRF_SECRET: ${CSRF_SECRET:?Defina CSRF_SECRET no .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      db:
        condition: service_healthy
volumes:
  fintcc_pg:
